apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jobboard.fullname" . }}-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "jobboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@{{ include "jobboard.fullname" . }}-postgres:{{ .Values.postgres.port }}/{{ .Values.postgres.auth.database }}"
  JWT_SECRET: "dev_jwt_secret_change_in_production_min_32_characters_long_12345"
