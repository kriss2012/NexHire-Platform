apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: jobboard
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Allow Ingress to Frontend from Ingress Controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  namespace: jobboard
spec:
  podSelector:
    matchLabels:
      app: jobboard-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    # Frontend only talks to Backend API
    - to:
        - podSelector:
            matchLabels:
              app: jobboard-backend
      ports:
        - protocol: TCP
          port: 3001
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

---
# Backend Policy: Accepts traffic from Frontend, talks to Postgres, Redis, and DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: jobboard
spec:
  podSelector:
    matchLabels:
      app: jobboard-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: jobboard-frontend
      ports:
        - protocol: TCP
          port: 3001
    # Also allow Prometheus scrape
    - ports:
        - protocol: TCP
          port: 3001
  egress:
    # To PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: jobboard-postgres
      ports:
        - protocol: TCP
          port: 5432
    # To Redis
    - to:
        - podSelector:
            matchLabels:
              app: jobboard-redis
      ports:
        - protocol: TCP
          port: 6379
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

---
# Database Policy: Strictly accepts connections from Backend only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: jobboard
spec:
  podSelector:
    matchLabels:
      app: jobboard-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: jobboard-backend
      ports:
        - protocol: TCP
          port: 5432

---
# Redis Policy: Strictly accepts connections from Backend only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-network-policy
  namespace: jobboard
spec:
  podSelector:
    matchLabels:
      app: jobboard-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: jobboard-backend
      ports:
        - protocol: TCP
          port: 6379
