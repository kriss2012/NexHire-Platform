apiVersion: v1
kind: Service
metadata:
  name: jobboard-redis
  namespace: jobboard
  labels:
    app: jobboard-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: jobboard-redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobboard-redis
  namespace: jobboard
  labels:
    app: jobboard-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobboard-redis
  template:
    metadata:
      labels:
        app: jobboard-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
