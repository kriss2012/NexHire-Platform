apiVersion: v1
kind: Service
metadata:
  name: jobboard-backend
  namespace: jobboard
  labels:
    app: jobboard-backend
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app: jobboard-backend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jobboard-backend-hpa
  namespace: jobboard
  labels:
    app: jobboard-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jobboard-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jobboard-backend-pdb
  namespace: jobboard
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: jobboard-backend
