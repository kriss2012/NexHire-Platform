apiVersion: v1
kind: Service
metadata:
  name: jobboard-postgres
  namespace: jobboard
  labels:
    app: jobboard-postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  clusterIP: None
  selector:
    app: jobboard-postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jobboard-postgres
  namespace: jobboard
  labels:
    app: jobboard-postgres
spec:
  serviceName: jobboard-postgres
  replicas: 1
  selector:
    matchLabels:
      app: jobboard-postgres
  template:
    metadata:
      labels:
        app: jobboard-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - configMapRef:
                name: jobboard-config
            - secretRef:
                name: jobboard-secret
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
