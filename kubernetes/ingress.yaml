apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobboard-ingress
  namespace: jobboard
  labels:
    app.kubernetes.io/name: jobboard-ingress
    app.kubernetes.io/part-of: jobboard-platform
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
spec:
  rules:
    - host: app.example.com
      http:
        paths:
          # Route Backend APIs to Backend Service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: jobboard-backend
                port:
                  number: 3001
          - path: /health
            pathType: Exact
            backend:
              service:
                name: jobboard-backend
                port:
                  number: 3001
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: jobboard-backend
                port:
                  number: 3001
          - path: /live
            pathType: Exact
            backend:
              service:
                name: jobboard-backend
                port:
                  number: 3001
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: jobboard-backend
                port:
                  number: 3001
          # Route All Other Traffic to Frontend SPA Service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jobboard-frontend
                port:
                  number: 3000
