apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobboard-frontend
  namespace: jobboard
  labels:
    app: jobboard-frontend
    app.kubernetes.io/name: jobboard-frontend
    app.kubernetes.io/part-of: jobboard-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: jobboard-frontend
  template:
    metadata:
      labels:
        app: jobboard-frontend
    spec:
      serviceAccountName: jobboard-app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx unprivileged user
        runAsGroup: 101
      containers:
        - name: frontend
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/jobboard-frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
