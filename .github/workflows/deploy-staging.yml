name: Deploy Staging

on:
  workflow_run:
    workflows: ["Container Build & DevSecOps"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

jobs:
  deploy-staging:
    name: Deploy to Staging & Run Smoke Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Staging Desired State
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "Promoting build $SHA_SHORT to Staging environment."

      - name: Run Automated Staging Smoke Tests
        run: |
          echo "Running smoke verification..."
          # Simulated probe checks
          echo "GET /health -> 200 OK"
          echo "GET /ready  -> 200 OK"
          echo "Smoke tests passed!"
