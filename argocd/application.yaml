apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jobboard-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: jobboard-production
    environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/example-org/jobboard-devops.git
    targetRevision: main
    path: helm/jobboard
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: jobboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
